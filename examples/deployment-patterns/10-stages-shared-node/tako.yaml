project:
  name: pattern-stages
  version: 1.0.0

servers:
  prod:
    host: ${SERVER_HOST}
    user: root
    sshKey: ${SSH_KEY}

environments:
  # Template shared by every stage. Abstract environments are never deployed
  # on their own; preview and production extend it and override only what
  # differs.
  base:
    abstract: true
    servers:
      - prod
    services:
      web:
        build: .
        port: 3000
        proxy:
          email: ${LETSENCRYPT_EMAIL}
        env:
          NODE_ENV: production
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s
          retries: 3

  preview:
    extends: base
    services:
      web:
        proxy:
          domain: preview-stages.${SERVER_HOST}.sslip.io
        env:
          APP_STAGE: preview

  production:
    extends: base
    services:
      web:
        proxy:
          domain: stages.${SERVER_HOST}.sslip.io
        env:
          APP_STAGE: production
